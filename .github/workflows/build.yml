name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 构建 Windows 可执行文件
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 构建 Release
        run: cargo build --release --locked

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: codex-plus-launcher-windows-x64
          path: target/release/codex-plus-launcher.exe
          if-no-files-found: error
